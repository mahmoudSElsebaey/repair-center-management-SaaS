<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/fixer-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A12" />

    <title>Fixer — نظام إدارة مراكز الصيانة</title>
    <meta
      name="description"
      content="Fixer is the operations platform for repair businesses: customers, devices, repair tickets, technicians, spare parts, invoices and payments in one system."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fixer" />
    <meta property="og:title" content="Fixer — Repair Center Operations Platform" />
    <meta
      property="og:description"
      content="Run the whole repair operation from intake to warranty: tickets, technicians, parts, approvals, invoices and customer tracking."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var theme = localStorage.getItem('fixer:theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
          var lang = localStorage.getItem('fixer:lang');
          if (lang === 'ar' || lang === 'en') {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {
          /* localStorage unavailable — keep the defaults from the markup */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
